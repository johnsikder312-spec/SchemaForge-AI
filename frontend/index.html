<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SchemaForge AI turns a plain-language app idea into a database schema, ER diagram and SQL for PostgreSQL, MySQL and SQLite."
    />
    <title>SchemaForge AI</title>
    <script>
      // Set the theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('schemaforge-theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
          }
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
